<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080711"><title>SHADOW ARISE V4</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080711;color:#fff;font-family:system-ui,Arial}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}canvas{pointer-events:none}header{position:absolute;top:env(safe-area-inset-top);left:0;right:0;text-align:center;padding:13px;font-size:12px;font-weight:800;letter-spacing:.19em;text-shadow:0 1px 8px #000;background:linear-gradient(#080711aa,transparent)}header span{opacity:.55}#help{position:absolute;top:calc(48px + env(safe-area-inset-top));width:100%;text-align:center;font-size:12px;text-shadow:0 1px 5px #000;padding:0 15px}#controls{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));left:0;right:0;display:flex;align-items:center;justify-content:center;gap:18px}button{cursor:pointer;touch-action:manipulation;color:#fff;border:1px solid #9970d3;background:#1b132b;box-shadow:0 0 18px #7e32e850}#flip{width:50px;height:50px;border-radius:50%;font-size:26px}#arise{min-width:148px;height:64px;border-radius:35px;background:linear-gradient(130deg,#241238,#58318a);font-size:19px;font-weight:900;letter-spacing:.12em}#shot{height:64px;width:64px;border-radius:50%;background:#211832;display:grid;place-items:center}#shot svg{width:30px;height:30px;fill:#fff}#save{display:none;position:absolute;right:12px;top:calc(58px + env(safe-area-inset-top));background:#25143b;border:1px solid #b48bff;border-radius:12px;padding:9px 12px;color:white;text-decoration:none;font-size:13px}#notice{position:absolute;bottom:calc(98px + env(safe-area-inset-bottom));width:100%;text-align:center;font-size:12px;text-shadow:0 1px 6px #000;padding:0 20px}#flash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none;transition:opacity .15s}
</style></head><body><video id="camera" autoplay playsinline muted></video><canvas id="effects"></canvas><div id="flash"></div><header>SHADOW ARISE <span>V4</span></header><div id="help">Allinea i piedi al cerchio, poi premi ARISE</div><a id="save" download="shadow-arise.jpg">SALVA FOTO ↓</a><div id="notice">Consenti l'accesso alla fotocamera</div><div id="controls"><button id="flip" aria-label="Cambia fotocamera" title="Cambia fotocamera">⟳</button><button id="arise">ARISE</button><button id="shot" aria-label="Scatta foto" title="Scatta foto"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.2 4.2h7.6l1.35 2H20a2 2 0 0 1 2 2v9.5a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8.2a2 2 0 0 1 2-2h2.85l1.35-2ZM12 9a4.25 4.25 0 1 0 0 8.5A4.25 4.25 0 0 0 12 9Zm0 2a2.25 2.25 0 1 1 0 4.5 2.25 2.25 0 0 1 0-4.5Z"/></svg></button></div>
<script>(()=>{'use strict';const video=document.getElementById('camera'),canvas=document.getElementById('effects'),g=canvas.getContext('2d'),notice=document.getElementById('notice'),help=document.getElementById('help'),save=document.getElementById('save');let stream=null,facing='environment',active=false,started=0,last=0,smoke=[],bolts=[],tendrils=[];const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));let W=innerWidth,H=innerHeight,D=1;function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();const base=()=>({x:W*.5,y:H*.785,rx:Math.min(W*.32,H*.17),ry:Math.min(W*.105,H*.05)});
async function startCamera(){if(stream)stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:1920}}});video.srcObject=stream;await video.play();notice.textContent='Posiziona i piedi sul cerchio luminoso'}catch(e){notice.textContent='Fotocamera non disponibile. Controlla permessi e HTTPS.'}}document.getElementById('flip').onclick=()=>{facing=facing==='environment'?'user':'environment';startCamera()};startCamera();
function circle(b,t,alpha){g.save();g.translate(b.x,b.y);g.scale(1,.34);g.shadowBlur=14;g.shadowColor='#8d50ff';g.strokeStyle=`rgba(167,122,255,${alpha})`;g.lineWidth=2;g.beginPath();g.arc(0,0,b.rx,0,Math.PI*2);g.stroke();g.shadowBlur=0;g.lineWidth=1;g.strokeStyle=`rgba(84,152,255,${alpha*.65})`;g.beginPath();g.arc(0,0,b.rx*.77,0,Math.PI*2);g.stroke();for(let i=0;i<12;i++){const a=i*Math.PI/6+t*.00012;const x=Math.cos(a)*b.rx*.88,y=Math.sin(a)*b.rx*.88;g.beginPath();g.moveTo(x-4,y);g.lineTo(x+4,y);g.stroke()}g.restore();const glow=g.createRadialGradient(b.x,b.y,0,b.x,b.y,b.rx*1.3);glow.addColorStop(0,`rgba(91,47,188,${alpha*.18})`);glow.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=glow;g.beginPath();g.ellipse(b.x,b.y,b.rx*1.3,b.ry*1.5,0,0,Math.PI*2);g.fill()}
function addSmoke(b){const z=rnd(.7,1.5),sx=b.x+rnd(-b.rx*.68,b.rx*.68),kind=Math.random();smoke.push({x:sx,y:b.y+rnd(-b.ry*.5,b.ry*.5),age:0,ttl:rnd(95,175),vy:rnd(.55,1.28),drift:rnd(-.46,.46),width:rnd(5,12)*z,seed:rnd(0,6.3),kind,alpha:rnd(.10,.25)});if(smoke.length>125)smoke.shift()}
function addBolt(b){const side=Math.random()<.5?-1:1,originX=b.x+side*b.rx*rnd(.36,.85),topY=b.y-H*rnd(.30,.51),pts=[];const bend=rnd(.03,.12)*W;for(let i=0;i<13;i++){const q=i/12;pts.push([originX+side*(q*q)*bend+Math.sin(q*14)*W*.012+rnd(-W*.012,W*.012),b.y-(b.y-topY)*q])}bolts.push({pts,age:0,ttl:rnd(9,18),color:Math.random()});if(bolts.length>9)bolts.shift()}
function addTendril(b){const side=Math.random()<.5?-1:1;const x=b.x+side*b.rx*rnd(.18,.82);tendrils.push({x,y:b.y,side,age:0,ttl:rnd(100,170),height:H*rnd(.17,.42),bend:W*rnd(.04,.18),thick:rnd(2.5,6.5),seed:rnd(0,6.3)});if(tendrils.length>15)tendrils.shift()}
function drawSmoke(p,b,rise){const q=p.age/p.ttl,fade=Math.pow(Math.sin(Math.PI*q),.8)*rise,vertical=b.y-p.y;const spread=1+vertical/(H*.26)*.7;const r=p.width*(1+q*1.6);g.save();g.translate(p.x,p.y);g.rotate(Math.sin(p.seed+p.age*.035)*.22);g.scale(spread,2.2);const c=p.kind<.48?'5,4,11':p.kind<.86?'68,19,108':'24,34,87';const grad=g.createRadialGradient(0,0,r*.06,0,0,r*1.6);grad.addColorStop(0,`rgba(${c},${p.alpha*fade})`);grad.addColorStop(.52,`rgba(${c},${p.alpha*.48*fade})`);grad.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=grad;g.beginPath();g.arc(0,0,r*1.6,0,Math.PI*2);g.fill();g.restore()}
function drawTendrils(b,rise){for(const p of tendrils){const q=p.age/p.ttl,visibility=Math.min(1,p.age/16)*Math.min(1,(1-q)*3)*rise;const h=p.height*Math.min(1,p.age/40);g.save();g.lineCap='round';g.shadowColor='#431263';g.shadowBlur=9;g.strokeStyle=`rgba(6,3,14,${visibility*.92})`;g.lineWidth=p.thick*(1-q*.45);g.beginPath();g.moveTo(p.x,p.y);g.bezierCurveTo(p.x+p.side*p.bend*.1,p.y-h*.32,p.x+p.side*p.bend*1.3,p.y-h*.52,p.x+p.side*p.bend*.65,p.y-h);g.stroke();g.shadowBlur=0;g.strokeStyle=`rgba(124,42,198,${visibility*.32})`;g.lineWidth=1;g.stroke();g.restore()}}
function lightning(b){for(const l of bolts){const alpha=clamp(1-l.age/l.ttl,0,1);g.save();g.lineJoin='round';g.lineCap='round';g.beginPath();l.pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));const dark=l.color<.5;g.strokeStyle=dark?`rgba(3,1,12,${alpha*.98})`:l.color<.75?`rgba(92,33,168,${alpha*.94})`:`rgba(61,117,241,${alpha*.9})`;g.lineWidth=dark?5:3.3;g.shadowColor=dark?'#7b28d1':l.color<.75?'#9d49f7':'#4e85ff';g.shadowBlur=dark?8:14;g.stroke();g.shadowBlur=0;if(!dark){g.lineWidth=.8;g.strokeStyle=`rgba(212,182,255,${alpha*.8})`;g.stroke()}g.restore()}}
function render(t){const b=base(),dt=clamp((t-last)/16.7||1,.1,2);last=t;g.clearRect(0,0,W,H);if(!active){circle(b,t,.76+.13*Math.sin(t*.003))}else{const seconds=(t-started)/1000,rise=clamp(seconds/2.9,0,1);if(seconds<.42)circle(b,t,(1-seconds/.42)*.85);if(Math.random()<.78*rise)addSmoke(b);if(Math.random()<.13*rise)addBolt(b);if(Math.random()<.038*rise)addTendril(b);const aura=g.createRadialGradient(b.x,b.y,0,b.x,b.y,b.rx*1.35);aura.addColorStop(0,`rgba(44,9,86,${rise*.12})`);aura.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=aura;g.beginPath();g.ellipse(b.x,b.y,b.rx*1.35,b.ry*1.8,0,0,Math.PI*2);g.fill();g.save();g.beginPath();g.rect(b.x-b.rx*1.65,b.y-H*.54,b.rx*3.3,H*.57);g.clip();for(const p of smoke){p.age+=dt;p.y-=p.vy*dt;p.x+=p.drift*dt+Math.sin(p.seed+p.age*.08)*.19;drawSmoke(p,b,rise)}for(const p of tendrils)p.age+=dt;drawTendrils(b,rise);g.restore();smoke=smoke.filter(p=>p.age<p.ttl);tendrils=tendrils.filter(p=>p.age<p.ttl);for(const l of bolts)l.age+=dt;lightning(b);bolts=bolts.filter(l=>l.age<l.ttl)}requestAnimationFrame(render)}requestAnimationFrame(render);
document.getElementById('arise').onclick=()=>{active=true;started=performance.now();smoke=[];bolts=[];tendrils=[];help.textContent='Evocazione in corso';notice.textContent='Attendi il fumo, poi scatta';setTimeout(()=>{if(active)notice.textContent='Pronto per la foto'},2800)};
function drawVideoCover(o,w,h){const vw=video.videoWidth,vh=video.videoHeight;if(!vw||!vh)return false;const scale=Math.max(w/vw,h/vh),sw=vw*scale,sh=vh*scale;o.save();if(facing==='user'){o.translate(w,0);o.scale(-1,1)}o.drawImage(video,(w-sw)/2,(h-sh)/2,sw,sh);o.restore();return true}
document.getElementById('shot').onclick=()=>{if(!video.videoWidth){notice.textContent='Attendi la fotocamera';return}const out=document.createElement('canvas');out.width=canvas.width;out.height=canvas.height;const o=out.getContext('2d');o.setTransform(out.width/W,0,0,out.height/H,0,0);drawVideoCover(o,W,H);o.drawImage(canvas,0,0,W,H);out.toBlob(blob=>{if(!blob)return;if(save.dataset.url)URL.revokeObjectURL(save.dataset.url);const url=URL.createObjectURL(blob);save.dataset.url=url;save.href=url;save.style.display='block';save.click();notice.textContent='Foto pronta. Se necessario premi SALVA FOTO.'},'image/jpeg',.9)};
})();</script></body></html>
