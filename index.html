<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c0715"><title>SHADOW ARISE</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090510;color:white;font-family:system-ui,Arial}video,canvas{position:absolute;width:100%;height:100%;object-fit:cover;inset:0}#camera{background:radial-gradient(ellipse at 50% 70%,#322047,#08050d)}#fx{pointer-events:none}#top{position:absolute;top:env(safe-area-inset-top,12px);left:0;right:0;text-align:center;text-shadow:0 2px 8px #000;padding:12px}h1{font-size:20px;letter-spacing:4px;margin:0;color:#e1c5ff}#top small{font-size:10px;letter-spacing:2px;color:#cbb5e3}#bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom,12px) + 16px);left:0;right:0;display:flex;align-items:center;justify-content:center;gap:15px;padding:0 10px}button{border:1px solid #b980f8;background:#1b102bdb;color:white;border-radius:40px;padding:15px 18px;font-weight:800;letter-spacing:1px;box-shadow:0 0 18px #7224c155;cursor:pointer}#arise{background:linear-gradient(120deg,#56208c,#a43cf0);font-size:20px;min-width:130px}#notice{position:absolute;top:90px;left:18px;right:18px;text-align:center;font-size:13px;color:#f1e5ff;text-shadow:0 2px 5px #000}#preview{display:none;position:absolute;inset:0;background:#080510ed;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:16px}#preview img{max-height:75%;max-width:100%;object-fit:contain;border:1px solid #8c5ac2}a{color:white;background:#67349e;padding:13px 22px;border-radius:24px;text-decoration:none;font-weight:700}#hint{position:absolute;bottom:100px;left:10px;right:10px;text-align:center;font-size:12px;color:#e2d2f0;text-shadow:0 2px 5px #000}#start{position:absolute;inset:0;background:linear-gradient(160deg,#0b0717,#241032);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;gap:18px}#start h2{letter-spacing:4px;font-size:32px;color:#dcb7ff;margin:0}#start p{max-width:320px;line-height:1.5;color:#dfd3ea}#start button{background:#7334b0}#start small{color:#bca6cd}</style></head><body><video id="camera" autoplay muted playsinline></video><canvas id="fx"></canvas><div id="top"><h1>SHADOW ARISE</h1><small>SHADOW MONARCH PHOTO EXPERIENCE</small></div><div id="notice"></div><div id="hint">Inquadra la cosplayer a figura intera, poi premi ARISE</div><div id="bottom"><button id="flip" aria-label="Cambia fotocamera">↻</button><button id="arise">ARISE</button><button id="snap" aria-label="Scatta foto">📷</button></div><div id="preview"><img id="photo" alt="Foto con effetto"><a id="save" download="shadow-arise.png">SALVA FOTO</a><button id="close">TORNA ALLA CAMERA</button></div><div id="start"><h2>SHADOW ARISE</h2><p>Inquadra il soggetto, premi <b>ARISE</b> per evocare le ombre e scatta la tua foto.</p><button id="go">APRI FOTOCAMERA</button><small>Nessuna app da installare · Permesso fotocamera richiesto</small></div><script>
const v=document.getElementById('camera'),c=document.getElementById('fx'),ctx=c.getContext('2d'),msg=document.getElementById('notice');let stream=null,facing='environment',active=false,birth=0,particles=[],w=0,h=0,last=0;function resize(){w=c.width=innerWidth*devicePixelRatio;h=c.height=innerHeight*devicePixelRatio}addEventListener('resize',resize);resize();async function camera(){if(!navigator.mediaDevices?.getUserMedia){msg.textContent='Serve HTTPS e un browser con accesso alla fotocamera.';return false}try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:1920}}});v.srcObject=stream;await v.play();msg.textContent='';return true}catch(e){msg.textContent='Fotocamera non disponibile: verifica permessi e connessione HTTPS.';return false}}
document.getElementById('go').onclick=async()=>{document.getElementById('start').style.display='none';await camera()};document.getElementById('flip').onclick=async()=>{facing=facing==='environment'?'user':'environment';await camera()};document.getElementById('arise').onclick=()=>{active=true;birth=performance.now();particles=[]};function spawn(){let x=Math.random()*w,y=h*(.88+Math.random()*.2),r=(20+Math.random()*90)*devicePixelRatio;particles.push({x,y,r,vx:(Math.random()-.5)*.34*devicePixelRatio,vy:(.28+Math.random()*.8)*devicePixelRatio,life:0,max:100+Math.random()*145,purple:Math.random()<.28,phase:Math.random()*6.28})}function draw(t){requestAnimationFrame(draw);ctx.clearRect(0,0,w,h);if(!active)return;let elapsed=(t-birth)/1000,amount=Math.min(1,elapsed/3);if(t-last>22){last=t;for(let i=0;i<Math.ceil(amount*3);i++)spawn()}ctx.save();ctx.globalCompositeOperation='screen';for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life++;p.y-=p.vy;p.x+=p.vx+Math.sin(p.phase+p.life*.022)*.45*devicePixelRatio;let a=Math.min(1,p.life/22)*Math.min(1,(p.max-p.life)/50)*amount;let r=p.r*(.55+p.life/p.max*.8);let g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);if(p.purple){g.addColorStop(0,`rgba(112,28,194,${a*.18})`);g.addColorStop(.5,`rgba(91,17,150,${a*.11})`)}else{g.addColorStop(0,`rgba(43,28,53,${a*.24})`);g.addColorStop(.5,`rgba(25,18,35,${a*.13})`)}g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(p.x-r,p.y-r,2*r,2*r);if(p.life>p.max)particles.splice(i,1)}ctx.restore();let grad=ctx.createLinearGradient(0,h*.66,0,h);grad.addColorStop(0,'rgba(30,5,46,0)');grad.addColorStop(1,`rgba(19,7,29,${.38*amount})`);ctx.fillStyle=grad;ctx.fillRect(0,h*.65,w,h*.35)}requestAnimationFrame(draw);
function capture(){if(!stream){msg.textContent='Prima abilita la fotocamera.';return}let out=document.createElement('canvas');out.width=1080;out.height=1350;let x=out.getContext('2d');let vw=v.videoWidth,vh=v.videoHeight;if(!vw||!vh){msg.textContent='Fotocamera non pronta.';return}let scale=Math.max(out.width/vw,out.height/vh),sw=out.width/scale,sh=out.height/scale;x.drawImage(v,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,out.width,out.height);let fxRatio=Math.max(out.width/w,out.height/h),cw=out.width/fxRatio,ch=out.height/fxRatio;x.drawImage(c,(w-cw)/2,(h-ch)/2,cw,ch,0,0,out.width,out.height);let url=out.toDataURL('image/png');document.getElementById('photo').src=url;document.getElementById('save').href=url;document.getElementById('preview').style.display='flex'}document.getElementById('snap').onclick=capture;document.getElementById('close').onclick=()=>document.getElementById('preview').style.display='none';</script></body></html>
