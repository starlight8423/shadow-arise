<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080711"><title>SHADOW ARISE V7</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080711;color:#fff;font-family:system-ui,Arial}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}canvas{pointer-events:none}header{position:absolute;top:env(safe-area-inset-top);left:0;right:0;text-align:center;padding:13px;font-size:12px;font-weight:800;letter-spacing:.19em;text-shadow:0 1px 8px #000;background:linear-gradient(#080711aa,transparent)}header span{opacity:.55}#help{position:absolute;top:calc(48px + env(safe-area-inset-top));width:100%;text-align:center;font-size:12px;text-shadow:0 1px 5px #000;padding:0 15px}#controls{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));left:0;right:0;display:flex;align-items:center;justify-content:center;gap:18px}button{cursor:pointer;touch-action:manipulation;color:#fff;border:1px solid #9970d3;background:#1b132b;box-shadow:0 0 18px #7e32e850}#flip{width:50px;height:50px;border-radius:50%;font-size:26px}#arise{min-width:148px;height:64px;border-radius:35px;background:linear-gradient(130deg,#241238,#58318a);font-size:19px;font-weight:900;letter-spacing:.12em}#shot{height:64px;width:64px;border-radius:50%;background:#211832;display:grid;place-items:center}#shot svg{width:30px;height:30px;fill:#fff}#save{display:none;position:absolute;right:12px;top:calc(58px + env(safe-area-inset-top));background:#25143b;border:1px solid #b48bff;border-radius:12px;padding:9px 12px;color:white;text-decoration:none;font-size:13px}#notice{position:absolute;bottom:calc(98px + env(safe-area-inset-bottom));width:100%;text-align:center;font-size:12px;text-shadow:0 1px 6px #000;padding:0 20px}#flash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none;transition:opacity .15s}
</style></head><body><video id="camera" autoplay playsinline muted></video><canvas id="effects"></canvas><div id="flash"></div><header>SHADOW ARISE <span>V7</span></header><div id="help">Allinea i piedi al cerchio e premi ARISE</div><a id="save" download="shadow-arise.jpg">SALVA FOTO ↓</a><div id="notice">Consenti l'accesso alla fotocamera</div><div id="controls"><button id="flip" aria-label="Cambia fotocamera" title="Cambia fotocamera">⟳</button><button id="arise">ARISE</button><button id="shot" aria-label="Scatta foto" title="Scatta foto"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.2 4.2h7.6l1.35 2H20a2 2 0 0 1 2 2v9.5a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8.2a2 2 0 0 1 2-2h2.85l1.35-2ZM12 9a4.25 4.25 0 1 0 0 8.5A4.25 4.25 0 0 0 12 9Zm0 2a2.25 2.25 0 1 1 0 4.5 2.25 2.25 0 0 1 0-4.5Z"/></svg></button></div>

<script>
(()=>{'use strict';
const video=document.querySelector('#camera'),canvas=document.querySelector('#effects'),ctx=canvas.getContext('2d',{alpha:true}),notice=document.querySelector('#notice'),help=document.querySelector('#help'),save=document.querySelector('#save');
let W=innerWidth,H=innerHeight,D=1,stream=null,facing='environment',active=false,started=0,last=0;
const art=document.createElement('canvas'),ag=art.getContext('2d'),smoke=document.createElement('canvas'),sg=smoke.getContext('2d');
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const base=()=>({x:W*.5,y:H*.745,rx:Math.min(W*.26,H*.14),ry:Math.min(W*.085,H*.043)});
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);art.width=smoke.width=Math.round(W);art.height=smoke.height=Math.round(H);drawStatic()}
addEventListener('resize',resize);
async function startCamera(){if(stream)stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:1920}}});video.srcObject=stream;await video.play();notice.textContent='Allinea i piedi al cerchio e premi ARISE'}catch(e){notice.textContent='Fotocamera non disponibile: controlla HTTPS e permessi'}}
document.querySelector('#flip').onclick=()=>{facing=facing==='environment'?'user':'environment';startCamera()};
function circle(c,t){const b=base();c.save();c.translate(b.x,b.y);c.scale(1,.34);c.strokeStyle='rgba(174,126,255,.85)';c.lineWidth=2;c.shadowBlur=13;c.shadowColor='#8c43f6';c.beginPath();c.arc(0,0,b.rx,0,Math.PI*2);c.stroke();c.shadowBlur=0;c.strokeStyle='rgba(106,151,255,.55)';c.lineWidth=1;c.beginPath();c.arc(0,0,b.rx*.76,0,Math.PI*2);c.stroke();for(let i=0;i<12;i++){const a=i*Math.PI/6+t*.00016,x=Math.cos(a)*b.rx*.9,y=Math.sin(a)*b.rx*.9;c.beginPath();c.moveTo(x-4,y);c.lineTo(x+4,y);c.stroke()}c.restore()}
function mistBlob(c,x,y,rx,ry,col,a){c.save();c.translate(x,y);c.scale(rx,ry);const gr=c.createRadialGradient(0,0,.08,0,0,1);gr.addColorStop(0,`rgba(${col},${a})`);gr.addColorStop(.45,`rgba(${col},${a*.55})`);gr.addColorStop(1,`rgba(${col},0)`);c.fillStyle=gr;c.beginPath();c.arc(0,0,1,0,Math.PI*2);c.fill();c.restore()}
function branch(c,x,y,side,h,seed){const bend=Math.sin(seed*2)*W*.04,tip=x+side*W*.045+bend;c.save();c.lineCap='round';c.lineJoin='round';c.strokeStyle='rgba(2,1,8,.88)';c.lineWidth=Math.max(2,W*.007);c.beginPath();c.moveTo(x,y);c.bezierCurveTo(x+side*W*.008,y-h*.30,x-side*W*.018,y-h*.52,tip,y-h);c.stroke();for(let k=0;k<3;k++){const f=.34+k*.20,bx=x+side*W*.008*f+bend*f*.7,by=y-h*f,dir=k%2?side:-side; c.lineWidth=Math.max(1,W*.003*(1-f));c.beginPath();c.moveTo(bx,by);c.quadraticCurveTo(bx+dir*W*.036,by-h*.06,bx+dir*W*.035,by-h*(.16+k*.015));c.stroke()}c.restore()}
function bolt(c,x,y,side,h,color){c.save();c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(x,y);for(let i=1;i<=7;i++){let f=i/7;c.lineTo(x+side*W*.06*f+Math.sin(f*15+x)*W*.009,y-h*f)}c.strokeStyle=color;c.lineWidth=2.3;c.shadowBlur=9;c.shadowColor=color;c.stroke();c.restore()}
function drawStatic(){const b=base();ag.clearRect(0,0,W,H);sg.clearRect(0,0,W,H);
// Transparent broad, perspective-based plume. Keep center of people visible.
for(let i=0;i<50;i++){let u=(i/49)*2-1;const x=b.x+u*b.rx*1.85+rand(-W*.035,W*.035);const y=b.y-rand(-H*.015,H*.17);mistBlob(ag,x,y,W*rand(.10,.22),H*rand(.055,.14),i%4===0?'81,35,154':i%5===0?'33,53,124':'13,8,28',rand(.065,.15))}
for(let i=0;i<26;i++){const x=b.x+rand(-W*.55,W*.55),y=b.y-rand(H*.12,H*.43);mistBlob(ag,x,y,W*rand(.09,.21),H*rand(.06,.15),i%3===0?'82,39,143':'21,11,39',rand(.018,.055))}
for(let i=0;i<9;i++){let side=i%2?-1:1,x=b.x+side*b.rx*rand(.45,1.45);branch(ag,x,b.y,side,H*rand(.10,.23),i*.78)}
for(let i=0;i<5;i++){let side=i%2?-1:1;bolt(ag,b.x+side*b.rx*rand(.8,1.55),b.y-H*.015,side,H*rand(.22,.40),i%2?'rgba(116,58,194,.35)':'rgba(12,5,27,.68)')}
// Very subtle edge framing, leaving the real camera scene dominant.
for(const side of [-1,1]){for(let j=0;j<9;j++){let x=side<0?rand(-W*.09,W*.055):rand(W*.945,W*1.09),y=rand(H*.17,H*.83);mistBlob(ag,x,y,W*.13,H*.12,j%3?'45,22,79':'78,31,140',.035)}}
}
function drawMoving(t){const b=base(),secs=(t-started)/1000;for(let i=0;i<9;i++){const phase=(secs*.085+i/9)%1, x=b.x+Math.sin(i*17+secs*.34)*b.rx*1.5+(i-4)*b.rx*.23,y=b.y-H*(.055+phase*.34),fade=Math.sin(Math.PI*phase);mistBlob(ctx,x,y,W*(.09+phase*.11),H*(.055+phase*.04),i%3===0?'104,47,164':'20,10,42',.05*fade)}}
function render(t){if(t-last<65){requestAnimationFrame(render);return}last=t;ctx.clearRect(0,0,W,H);if(active){ctx.drawImage(art,0,0,W,H);drawMoving(t)}else circle(ctx,t);requestAnimationFrame(render)}
document.querySelector('#arise').onclick=()=>{active=!active;started=performance.now();help.textContent=active?'Evocazione attiva · scatta quando vuoi':'Allinea i piedi al cerchio e premi ARISE';notice.textContent=active?'Set attivo: fumo e ombre restano visibili':'Pronta per una nuova evocazione'};
function drawVideoCover(o,w,h){let vw=video.videoWidth,vh=video.videoHeight;if(!vw||!vh)return false;let scale=Math.max(w/vw,h/vh),sw=vw*scale,sh=vh*scale;o.save();if(facing==='user'){o.translate(w,0);o.scale(-1,1)}o.drawImage(video,(w-sw)/2,(h-sh)/2,sw,sh);o.restore();return true}
document.querySelector('#shot').onclick=()=>{if(!video.videoWidth){notice.textContent='Attendi che la fotocamera sia pronta';return}const out=document.createElement('canvas');out.width=canvas.width;out.height=canvas.height;const o=out.getContext('2d');o.setTransform(out.width/W,0,0,out.height/H,0,0);drawVideoCover(o,W,H);o.drawImage(canvas,0,0,W,H);out.toBlob(blob=>{if(!blob){notice.textContent='Impossibile salvare la foto';return}if(save.dataset.url)URL.revokeObjectURL(save.dataset.url);const url=URL.createObjectURL(blob);save.dataset.url=url;save.href=url;save.style.display='block';save.click();notice.textContent='Foto pronta. Se necessario premi SALVA FOTO'},'image/jpeg',.92)};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&stream&&video.paused)video.play().catch(()=>{})});
resize();requestAnimationFrame(render);startCamera();
})();
</script></body></html>
