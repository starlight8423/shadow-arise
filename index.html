<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080711"><title>SHADOW ARISE V6</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080711;color:#fff;font-family:system-ui,Arial}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}canvas{pointer-events:none}header{position:absolute;top:env(safe-area-inset-top);left:0;right:0;text-align:center;padding:13px;font-size:12px;font-weight:800;letter-spacing:.19em;text-shadow:0 1px 8px #000;background:linear-gradient(#080711aa,transparent)}header span{opacity:.55}#help{position:absolute;top:calc(48px + env(safe-area-inset-top));width:100%;text-align:center;font-size:12px;text-shadow:0 1px 5px #000;padding:0 15px}#controls{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));left:0;right:0;display:flex;align-items:center;justify-content:center;gap:18px}button{cursor:pointer;touch-action:manipulation;color:#fff;border:1px solid #9970d3;background:#1b132b;box-shadow:0 0 18px #7e32e850}#flip{width:50px;height:50px;border-radius:50%;font-size:26px}#arise{min-width:148px;height:64px;border-radius:35px;background:linear-gradient(130deg,#241238,#58318a);font-size:19px;font-weight:900;letter-spacing:.12em}#shot{height:64px;width:64px;border-radius:50%;background:#211832;display:grid;place-items:center}#shot svg{width:30px;height:30px;fill:#fff}#save{display:none;position:absolute;right:12px;top:calc(58px + env(safe-area-inset-top));background:#25143b;border:1px solid #b48bff;border-radius:12px;padding:9px 12px;color:white;text-decoration:none;font-size:13px}#notice{position:absolute;bottom:calc(98px + env(safe-area-inset-bottom));width:100%;text-align:center;font-size:12px;text-shadow:0 1px 6px #000;padding:0 20px}#flash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none;transition:opacity .15s}
</style></head><body><video id="camera" autoplay playsinline muted></video><canvas id="effects"></canvas><div id="flash"></div><header>SHADOW ARISE <span>V6</span></header><div id="help">Allinea i piedi al cerchio, poi premi ARISE</div><a id="save" download="shadow-arise.jpg">SALVA FOTO ↓</a><div id="notice">Consenti l'accesso alla fotocamera</div><div id="controls"><button id="flip" aria-label="Cambia fotocamera" title="Cambia fotocamera">⟳</button><button id="arise">ARISE</button><button id="shot" aria-label="Scatta foto" title="Scatta foto"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.2 4.2h7.6l1.35 2H20a2 2 0 0 1 2 2v9.5a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8.2a2 2 0 0 1 2-2h2.85l1.35-2ZM12 9a4.25 4.25 0 1 0 0 8.5A4.25 4.25 0 0 0 12 9Zm0 2a2.25 2.25 0 1 1 0 4.5 2.25 2.25 0 0 1 0-4.5Z"/></svg></button></div>
<script>(()=>{'use strict';const video=document.getElementById('camera'),canvas=document.getElementById('effects'),g=canvas.getContext('2d'),notice=document.getElementById('notice'),help=document.getElementById('help'),save=document.getElementById('save');let stream=null,facing='environment',active=false,started=0,last=0,smoke=[],bolts=[],tendrils=[];const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));let W=innerWidth,H=innerHeight,D=1;function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();const base=()=>({x:W*.5,y:H*.765,rx:Math.min(W*.285,H*.155),ry:Math.min(W*.095,H*.045)});
async function startCamera(){if(stream)stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:1920}}});video.srcObject=stream;await video.play();notice.textContent='Posiziona i piedi sul cerchio luminoso'}catch(e){notice.textContent='Fotocamera non disponibile. Controlla permessi e HTTPS.'}}document.getElementById('flip').onclick=()=>{facing=facing==='environment'?'user':'environment';startCamera()};startCamera();document.addEventListener('visibilitychange',()=>{if(!document.hidden&&stream&&video.paused)video.play().catch(()=>{});});
function circle(b,t,alpha){g.save();g.translate(b.x,b.y);g.scale(1,.34);g.shadowBlur=14;g.shadowColor='#8d50ff';g.strokeStyle=`rgba(167,122,255,${alpha})`;g.lineWidth=2;g.beginPath();g.arc(0,0,b.rx,0,Math.PI*2);g.stroke();g.shadowBlur=0;g.lineWidth=1;g.strokeStyle=`rgba(84,152,255,${alpha*.65})`;g.beginPath();g.arc(0,0,b.rx*.77,0,Math.PI*2);g.stroke();for(let i=0;i<12;i++){const a=i*Math.PI/6+t*.00012;const x=Math.cos(a)*b.rx*.88,y=Math.sin(a)*b.rx*.88;g.beginPath();g.moveTo(x-4,y);g.lineTo(x+4,y);g.stroke()}g.restore();const glow=g.createRadialGradient(b.x,b.y,0,b.x,b.y,b.rx*1.3);glow.addColorStop(0,`rgba(91,47,188,${alpha*.18})`);glow.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=glow;g.beginPath();g.ellipse(b.x,b.y,b.rx*1.3,b.ry*1.5,0,0,Math.PI*2);g.fill()}
function addSmoke(b){const sx=b.x+rnd(-b.rx*.9,b.rx*.9),kind=Math.random();smoke.push({x:sx,y:b.y+rnd(-b.ry*.55,b.ry*.55),age:0,ttl:rnd(95,170),vy:rnd(.65,1.45),drift:rnd(-.85,.85),width:rnd(12,24),seed:rnd(0,6.3),kind,alpha:rnd(.15,.30)});if(smoke.length>80)smoke.shift()}
function addBolt(b){const side=Math.random()<.5?-1:1,originX=b.x+side*b.rx*rnd(.5,1.1),topY=b.y-H*rnd(.22,.43),pts=[];for(let i=0;i<10;i++){const q=i/9;pts.push([originX+side*q*q*W*.09+Math.sin(q*9)*W*.013+rnd(-W*.01,W*.01),b.y-(b.y-topY)*q])}bolts.push({pts,age:0,ttl:rnd(95,155),color:Math.random(),phase:rnd(0,6.28)});if(bolts.length>7)bolts.shift()}
function addTendril(b){const side=Math.random()<.5?-1:1;const x=b.x+side*b.rx*rnd(.22,1.03),height=H*rnd(.10,.22);const branches=[];for(let k=0;k<3;k++)branches.push({at:rnd(.3,.82),length:rnd(.12,.30),dir:Math.random()<.5?-1:1});tendrils.push({x,y:b.y,side,age:0,ttl:rnd(125,205),height,bend:W*rnd(.018,.08),thick:rnd(2,4.5),seed:rnd(0,6.3),branches});if(tendrils.length>10)tendrils.shift()}
function drawSmoke(p,b,rise){const q=p.age/p.ttl,fade=Math.pow(Math.sin(Math.PI*q),.8)*rise,vertical=b.y-p.y;const spread=1+Math.max(0,vertical)/(H*.24)*1.35;const r=p.width*(1+q*2.0);g.save();g.translate(p.x,p.y);g.rotate(Math.sin(p.seed+p.age*.035)*.22);g.scale(spread,1.65);const c=p.kind<.48?'5,4,11':p.kind<.86?'68,19,108':'24,34,87';const grad=g.createRadialGradient(0,0,r*.06,0,0,r*1.6);grad.addColorStop(0,`rgba(${c},${p.alpha*fade})`);grad.addColorStop(.52,`rgba(${c},${p.alpha*.48*fade})`);grad.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=grad;g.beginPath();g.arc(0,0,r*1.6,0,Math.PI*2);g.fill();g.restore()}
function drawTendrils(b,rise){for(const p of tendrils){const q=p.age/p.ttl,visibility=Math.min(1,p.age/22)*Math.min(1,(1-q)*4)*rise;const h=p.height*Math.min(1,p.age/42);const x=p.x,y=p.y,side=p.side,bend=p.bend;g.save();g.lineCap='round';g.lineJoin='round';g.shadowColor='#36104d';g.shadowBlur=0;g.strokeStyle=`rgba(3,2,9,${visibility*.96})`;g.lineWidth=p.thick*(1-q*.25);g.beginPath();g.moveTo(x,y);g.lineTo(x+side*bend*.16,y-h*.25);g.quadraticCurveTo(x+side*bend*.52,y-h*.41,x+side*bend*.33,y-h*.56);g.lineTo(x+side*bend*.58,y-h*.76);g.quadraticCurveTo(x+side*bend*.7,y-h*.91,x+side*bend*.62,y-h);g.stroke();g.shadowBlur=0;for(const branch of p.branches){const f=branch.at, bx=x+side*bend*(f<.56?.16+f*.3:.33+(f-.56)*.6),by=y-h*f;const len=h*branch.length;g.strokeStyle=`rgba(3,2,9,${visibility*.86})`;g.lineWidth=Math.max(.8,p.thick*(1-f)*.48);g.beginPath();g.moveTo(bx,by);g.lineTo(bx+branch.dir*len*.26,by-len*.38);g.quadraticCurveTo(bx+branch.dir*len*.52,by-len*.68,bx+branch.dir*len*.44,by-len);g.stroke()}g.restore()}}
function lightning(b){for(const l of bolts){const q=l.age/l.ttl,alpha=Math.pow(Math.max(0,1-q),.72)*(.75+.12*Math.sin(l.age*.15+l.phase));g.save();g.lineJoin='round';g.lineCap='round';g.beginPath();l.pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));const dark=l.color<.48;g.strokeStyle=dark?`rgba(8,3,21,${alpha*.70})`:l.color<.8?`rgba(116,53,184,${alpha*.52})`:`rgba(65,105,204,${alpha*.48})`;g.lineWidth=dark?6:4;g.shadowColor=dark?'#37104b':l.color<.8?'#a45bea':'#4b70df';g.shadowBlur=dark?5:9;g.stroke();g.restore()}}
function render(t){const b=base(),dt=clamp((t-last)/16.7||1,.1,3);last=t;if(t-last<32){requestAnimationFrame(render);return}g.clearRect(0,0,W,H);if(!active){circle(b,t,.76+.13*Math.sin(t*.003))}else{const seconds=(t-started)/1000,rise=clamp(seconds/2.9,0,1);if(seconds<.42)circle(b,t,(1-seconds/.42)*.85);if(Math.random()<.58*rise)addSmoke(b);if(Math.random()<.018*rise)addBolt(b);if(Math.random()<.013*rise)addTendril(b);const aura=g.createRadialGradient(b.x,b.y,0,b.x,b.y,b.rx*1.35);aura.addColorStop(0,`rgba(44,9,86,${rise*.12})`);aura.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=aura;g.beginPath();g.ellipse(b.x,b.y,b.rx*1.35,b.ry*1.8,0,0,Math.PI*2);g.fill();g.save();g.beginPath();g.rect(b.x-b.rx*2.5,b.y-H*.60,b.rx*5,H*.64);g.clip();for(const p of smoke){p.age+=dt;p.y-=p.vy*dt;p.x+=p.drift*dt+Math.sin(p.seed+p.age*.08)*.19;drawSmoke(p,b,rise)}for(const p of tendrils)p.age+=dt;drawTendrils(b,rise);g.restore();smoke=smoke.filter(p=>p.age<p.ttl);tendrils=tendrils.filter(p=>p.age<p.ttl);for(const l of bolts)l.age+=dt;lightning(b);bolts=bolts.filter(l=>l.age<l.ttl)}requestAnimationFrame(render)}requestAnimationFrame(render);
document.getElementById('arise').onclick=()=>{if(active){active=false;smoke=[];bolts=[];tendrils=[];help.textContent='Allinea i piedi al cerchio, poi premi ARISE';notice.textContent='Effetto fermato: premi ARISE per riavviare';return}active=true;started=performance.now();smoke=[];bolts=[];tendrils=[];help.textContent='Evocazione in corso';notice.textContent='Il fumo continua finché non premi di nuovo ARISE';setTimeout(()=>{if(active)notice.textContent='Evocazione attiva: puoi scattare quando vuoi'},2800)};
function drawVideoCover(o,w,h){const vw=video.videoWidth,vh=video.videoHeight;if(!vw||!vh)return false;const scale=Math.max(w/vw,h/vh),sw=vw*scale,sh=vh*scale;o.save();if(facing==='user'){o.translate(w,0);o.scale(-1,1)}o.drawImage(video,(w-sw)/2,(h-sh)/2,sw,sh);o.restore();return true}
document.getElementById('shot').onclick=()=>{if(!video.videoWidth){notice.textContent='Attendi la fotocamera';return}const out=document.createElement('canvas');out.width=canvas.width;out.height=canvas.height;const o=out.getContext('2d');o.setTransform(out.width/W,0,0,out.height/H,0,0);drawVideoCover(o,W,H);o.drawImage(canvas,0,0,W,H);out.toBlob(blob=>{if(!blob)return;if(save.dataset.url)URL.revokeObjectURL(save.dataset.url);const url=URL.createObjectURL(blob);save.dataset.url=url;save.href=url;save.style.display='block';save.click();notice.textContent='Foto pronta. Se necessario premi SALVA FOTO.'},'image/jpeg',.9)};
})();</script></body></html>
