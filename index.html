<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080711"><title>SHADOW ARISE V3</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080711;color:#fff;font-family:system-ui,Arial}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}canvas{pointer-events:none}header{position:absolute;top:env(safe-area-inset-top);left:0;right:0;text-align:center;padding:13px;font-size:12px;font-weight:800;letter-spacing:.19em;text-shadow:0 1px 8px #000;background:linear-gradient(#080711aa,transparent)}header span{opacity:.55}#help{position:absolute;top:calc(48px + env(safe-area-inset-top));width:100%;text-align:center;font-size:12px;text-shadow:0 1px 5px #000;padding:0 15px}#controls{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));left:0;right:0;display:flex;align-items:center;justify-content:center;gap:18px}button{cursor:pointer;touch-action:manipulation;color:#fff;border:1px solid #9970d3;background:#1b132b;box-shadow:0 0 18px #7e32e850}#flip{width:50px;height:50px;border-radius:50%;font-size:26px}#arise{min-width:148px;height:64px;border-radius:35px;background:linear-gradient(130deg,#241238,#58318a);font-size:19px;font-weight:900;letter-spacing:.12em}#shot{height:64px;width:64px;border-radius:50%;background:#211832;display:grid;place-items:center}#shot svg{width:30px;height:30px;fill:#fff}#save{display:none;position:absolute;right:12px;top:calc(58px + env(safe-area-inset-top));background:#25143b;border:1px solid #b48bff;border-radius:12px;padding:9px 12px;color:white;text-decoration:none;font-size:13px}#notice{position:absolute;bottom:calc(98px + env(safe-area-inset-bottom));width:100%;text-align:center;font-size:12px;text-shadow:0 1px 6px #000;padding:0 20px}#flash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none;transition:opacity .15s}
</style></head><body><video id="camera" autoplay playsinline muted></video><canvas id="effects"></canvas><div id="flash"></div><header>SHADOW ARISE <span>V3</span></header><div id="help">Allinea i piedi al cerchio, poi premi ARISE</div><a id="save" download="shadow-arise.jpg">SALVA FOTO ↓</a><div id="notice">Consenti l'accesso alla fotocamera</div><div id="controls"><button id="flip" aria-label="Cambia fotocamera" title="Cambia fotocamera">⟳</button><button id="arise">ARISE</button><button id="shot" aria-label="Scatta foto" title="Scatta foto"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.2 4.2h7.6l1.35 2H20a2 2 0 0 1 2 2v9.5a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8.2a2 2 0 0 1 2-2h2.85l1.35-2ZM12 9a4.25 4.25 0 1 0 0 8.5A4.25 4.25 0 0 0 12 9Zm0 2a2.25 2.25 0 1 1 0 4.5 2.25 2.25 0 0 1 0-4.5Z"/></svg></button></div>
<script>(()=>{'use strict';const video=document.getElementById('camera'),canvas=document.getElementById('effects'),g=canvas.getContext('2d'),notice=document.getElementById('notice'),help=document.getElementById('help'),save=document.getElementById('save');let stream=null,facing='environment',active=false,started=0,last=0,smoke=[],bolts=[],sparks=[];const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));let W=innerWidth,H=innerHeight,D=1;function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();const base=()=>({x:W*.5,y:H*.64,rx:Math.min(W*.17,H*.105),ry:Math.min(W*.055,H*.032)});
async function startCamera(){if(stream)stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:1920}}});video.srcObject=stream;await video.play();notice.textContent='Posiziona i piedi sul cerchio luminoso'}catch(e){notice.textContent='Fotocamera non disponibile. Controlla permessi e HTTPS.'}}document.getElementById('flip').onclick=()=>{facing=facing==='environment'?'user':'environment';startCamera()};startCamera();
function circle(b,t,alpha){g.save();g.translate(b.x,b.y);g.scale(1,.34);g.shadowBlur=14;g.shadowColor='#8d50ff';g.strokeStyle=`rgba(167,122,255,${alpha})`;g.lineWidth=2;g.beginPath();g.arc(0,0,b.rx,0,Math.PI*2);g.stroke();g.shadowBlur=0;g.lineWidth=1;g.strokeStyle=`rgba(84,152,255,${alpha*.65})`;g.beginPath();g.arc(0,0,b.rx*.77,0,Math.PI*2);g.stroke();for(let i=0;i<12;i++){const a=i*Math.PI/6+t*.00012;const x=Math.cos(a)*b.rx*.88,y=Math.sin(a)*b.rx*.88;g.beginPath();g.moveTo(x-4,y);g.lineTo(x+4,y);g.stroke()}g.restore();const glow=g.createRadialGradient(b.x,b.y,0,b.x,b.y,b.rx*1.3);glow.addColorStop(0,`rgba(91,47,188,${alpha*.18})`);glow.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=glow;g.beginPath();g.ellipse(b.x,b.y,b.rx*1.3,b.ry*1.5,0,0,Math.PI*2);g.fill()}
function addSmoke(b){const z=rnd(.55,1.2),sx=b.x+rnd(-b.rx*.56,b.rx*.56),kind=Math.random();smoke.push({x:sx,y:b.y+rnd(-b.ry*.3,b.ry*.3),origin:sx,age:0,ttl:rnd(55,125),vy:rnd(.55,1.55),drift:rnd(-.27,.27),width:rnd(5,13)*z,seed:rnd(0,6.3),kind,alpha:rnd(.3,.65)});if(smoke.length>170)smoke.shift()}
function addBolt(b){const side=Math.random()<.5?-1:1,originX=b.x+side*b.rx*rnd(.5,.95),topY=b.y-H*rnd(.13,.29),pts=[];for(let i=0;i<9;i++){const q=i/8;pts.push([originX+side*(q*q)*W*rnd(.01,.075)+rnd(-W*.012,W*.012),b.y-(b.y-topY)*q])}bolts.push({pts,age:0,ttl:rnd(5,10),blue:Math.random()<.45});if(bolts.length>6)bolts.shift()}
function drawSmoke(p,b,rise){const q=p.age/p.ttl,fade=Math.sin(Math.PI*q)*rise,vertical=b.y-p.y;const spread=1+vertical/(H*.22)*.55;const r=p.width*(1+q*1.8);g.save();g.translate(p.x,p.y);g.rotate(Math.sin(p.seed+p.age*.04)*.3);g.scale(spread,1.9);const c=p.kind<.68?'5,4,11':p.kind<.85?'34,12,68':'9,27,69';const grad=g.createRadialGradient(0,0,r*.1,0,0,r*1.55);grad.addColorStop(0,`rgba(${c},${p.alpha*fade})`);grad.addColorStop(.42,`rgba(${c},${p.alpha*.65*fade})`);grad.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=grad;g.beginPath();g.arc(0,0,r*1.55,0,Math.PI*2);g.fill();g.restore()}
function lightning(b){for(const l of bolts){const alpha=clamp(1-l.age/l.ttl,0,1);g.save();g.lineJoin='round';g.lineCap='round';g.beginPath();l.pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.strokeStyle=l.blue?`rgba(66,147,255,${alpha*.9})`:`rgba(163,83,255,${alpha*.95})`;g.lineWidth=3;g.shadowColor=l.blue?'#438cff':'#ac5cff';g.shadowBlur=13;g.stroke();g.shadowBlur=0;g.lineWidth=.9;g.strokeStyle=`rgba(234,228,255,${alpha})`;g.stroke();g.restore()}}
function render(t){const b=base(),dt=clamp((t-last)/16.7||1,.1,2);last=t;g.clearRect(0,0,W,H);if(!active){circle(b,t,.76+.13*Math.sin(t*.003))}else{const seconds=(t-started)/1000,rise=clamp(seconds/2.7,0,1);if(seconds<.5)circle(b,t,(1-seconds*2)*.85);for(let i=0;i<(rise<.2?1:3);i++)addSmoke(b);if(Math.random()<.09*rise)addBolt(b);const aura=g.createRadialGradient(b.x,b.y,0,b.x,b.y,b.rx*1.2);aura.addColorStop(0,`rgba(38,9,83,${rise*.23})`);aura.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=aura;g.beginPath();g.ellipse(b.x,b.y,b.rx*1.2,b.ry*1.8,0,0,Math.PI*2);g.fill();g.save();g.beginPath();g.rect(b.x-b.rx*1.6,b.y-H*.33,b.rx*3.2,H*.36);g.clip();for(const p of smoke){p.age+=dt;p.y-=p.vy*dt;p.x+=p.drift*dt+Math.sin(p.seed+p.age*.08)*.22;drawSmoke(p,b,rise)}g.restore();smoke=smoke.filter(p=>p.age<p.ttl);for(const l of bolts)l.age+=dt;lightning(b);bolts=bolts.filter(l=>l.age<l.ttl)}requestAnimationFrame(render)}requestAnimationFrame(render);
document.getElementById('arise').onclick=()=>{active=true;started=performance.now();smoke=[];bolts=[];help.textContent='Evocazione in corso';notice.textContent='Attendi il fumo, poi scatta';setTimeout(()=>{if(active)notice.textContent='Pronto per la foto'},2800)};
function drawVideoCover(o,w,h){const vw=video.videoWidth,vh=video.videoHeight;if(!vw||!vh)return false;const scale=Math.max(w/vw,h/vh),sw=vw*scale,sh=vh*scale;o.save();if(facing==='user'){o.translate(w,0);o.scale(-1,1)}o.drawImage(video,(w-sw)/2,(h-sh)/2,sw,sh);o.restore();return true}
document.getElementById('shot').onclick=()=>{if(!video.videoWidth){notice.textContent='Attendi la fotocamera';return}const out=document.createElement('canvas');out.width=canvas.width;out.height=canvas.height;const o=out.getContext('2d');o.setTransform(out.width/W,0,0,out.height/H,0,0);drawVideoCover(o,W,H);o.drawImage(canvas,0,0,W,H);out.toBlob(blob=>{if(!blob)return;if(save.dataset.url)URL.revokeObjectURL(save.dataset.url);const url=URL.createObjectURL(blob);save.dataset.url=url;save.href=url;save.style.display='block';save.click();notice.textContent='Foto pronta. Se necessario premi SALVA FOTO.'},'image/jpeg',.9)};
})();</script></body></html>
