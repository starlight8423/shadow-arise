<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090611"><title>SHADOW ARISE v2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080611;color:#fff;font-family:system-ui,Arial}#camera,#fx{position:absolute;width:100%;height:100%;object-fit:cover;inset:0}#camera{background:#12101b}#fx{pointer-events:none}header{position:absolute;top:env(safe-area-inset-top);left:0;right:0;text-align:center;padding:12px;background:linear-gradient(#090511aa,transparent);font-weight:800;letter-spacing:.2em;font-size:12px;text-shadow:0 0 14px #ad79ff}#bar{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));width:100%;display:flex;justify-content:center;align-items:center;gap:20px;padding:0 12px}button{touch-action:manipulation;border:1px solid #9864e9;background:#171026;color:white;cursor:pointer;box-shadow:0 0 18px #7e32e855}#arise{height:66px;min-width:145px;border-radius:40px;font-size:18px;font-weight:900;letter-spacing:.13em;background:linear-gradient(130deg,#241139,#512a83)}#shot{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:#f6f3ff;color:#160c23;border:4px solid #a879f0}#flip{height:52px;width:52px;border-radius:50%;font-size:24px}#msg{position:absolute;bottom:calc(100px + env(safe-area-inset-bottom));left:10%;width:80%;text-align:center;font-size:13px;text-shadow:0 1px 8px #000}svg{width:31px;height:31px}#download{position:absolute;top:50px;right:12px;padding:10px;border-radius:12px;background:#221536;display:none;text-decoration:none;color:white;font-size:13px}#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}#hint{position:absolute;top:45px;left:12px;font-size:11px;color:#d5c8e9} </style></head><body><video id="camera" autoplay playsinline muted></video><canvas id="fx"></canvas><div id="flash"></div><header>SHADOW ARISE <span style="opacity:.6">V2</span></header><div id="hint">Fumo prospettico · ombre e scariche</div><a id="download" download="shadow-arise.jpg">SALVA FOTO ↓</a><div id="msg">Consenti la fotocamera, inquadra a figura intera e premi ARISE.</div><div id="bar"><button id="flip" aria-label="Cambia fotocamera" title="Cambia fotocamera">⟳</button><button id="arise">ARISE</button><button id="shot" aria-label="Scatta fotografia" title="Scatta fotografia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7.5 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3.5z"/><circle cx="12" cy="13.5" r="3.5"/></svg></button></div><script>
(()=>{'use strict';const v=document.querySelector('#camera'),c=document.querySelector('#fx'),ctx=c.getContext('2d'),msg=document.querySelector('#msg'),save=document.querySelector('#download');let stream=null,facing='environment',active=false,started=0,seed=0,particles=[],bolts=[],last=0;const rand=(a,b)=>a+Math.random()*(b-a);function resize(){const d=Math.min(devicePixelRatio||1,2);c.width=Math.round(innerWidth*d);c.height=Math.round(innerHeight*d);ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();async function camera(){if(stream)stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:1920}}});v.srcObject=stream;await v.play();msg.textContent='Inquadra a figura intera e premi ARISE.'}catch(e){msg.textContent='Fotocamera non disponibile: controlla permessi e connessione HTTPS.'}}document.querySelector('#flip').onclick=()=>{facing=facing==='environment'?'user':'environment';camera()};camera();function spawn(){const w=innerWidth,h=innerHeight;const spread=w*.25;let x=w*.5+rand(-spread,spread);const z=rand(.35,1);particles.push({x,y:h*.87+rand(-h*.025,h*.035),vx:rand(-.16,.16),vy:rand(-1.55,-.55)*z,r:rand(14,39)*z,life:0,max:rand(70,160),alpha:rand(.09,.26),phase:rand(0,7),tint:Math.random()});if(particles.length>180)particles.shift()}
function lightning(){const w=innerWidth,h=innerHeight;const side=Math.random()<.5?-1:1;const base=w*.5+side*w*rand(.16,.29);const y=h*rand(.58,.86);const len=h*rand(.08,.21);const pts=[];for(let i=0;i<7;i++)pts.push([base+side*Math.sin(i*.9)*w*.025+rand(-w*.022,w*.022),y-len*i/6]);bolts.push({pts,life:0,max:rand(5,11),blue:Math.random()<.45});if(bolts.length>8)bolts.shift()}
function paint(t){const w=innerWidth,h=innerHeight;ctx.clearRect(0,0,w,h);if(active){const elapsed=(t-started)/1000;const rise=Math.min(1,elapsed/3);const dt=Math.min(2,(t-last)/16.67||1);for(let i=0;i<(rise>.1?3:1);i++)spawn();if(Math.random()<.065*rise)lightning();ctx.save();ctx.beginPath();ctx.rect(w*.13,h*.44,w*.74,h*.49);ctx.clip();const glow=ctx.createRadialGradient(w*.5,h*.83,0,w*.5,h*.83,w*.36);glow.addColorStop(0,`rgba(95,24,175,${.22*rise})`);glow.addColorStop(.55,`rgba(34,15,86,${.1*rise})`);glow.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=glow;ctx.fillRect(0,h*.4,w,h*.55);
for(const p of particles){p.life+=dt;p.y+=p.vy*dt;p.x+=p.vx*dt+Math.sin(p.life*.035+p.phase)*.25;const fade=Math.sin(Math.PI*Math.min(1,p.life/p.max))*rise;const r=p.r*(1+p.life/p.max*.7);const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*2.6);const base=p.tint<.72?'6,4,11':p.tint<.88?'41,12,84':'13,22,66';g.addColorStop(0,`rgba(${base},${Math.min(.64,p.alpha*2)*fade})`);g.addColorStop(.4,`rgba(${base},${p.alpha*fade})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(p.x-r*2.6,p.y-r*2.6,r*5.2,r*5.2)}particles=particles.filter(p=>p.life<p.max);
for(const b of bolts){b.life+=dt;const a=(1-b.life/b.max)*rise;ctx.beginPath();b.pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.strokeStyle=b.blue?`rgba(64,145,255,${a*.95})`:`rgba(160,75,255,${a*.95})`;ctx.lineWidth=rand(2,3.5);ctx.shadowColor=b.blue?'#4d8dff':'#a34dff';ctx.shadowBlur=14;ctx.stroke();ctx.lineWidth=.8;ctx.strokeStyle=`rgba(230,216,255,${a})`;ctx.stroke()}bolts=bolts.filter(b=>b.life<b.max);ctx.restore()}last=t;requestAnimationFrame(paint)}requestAnimationFrame(paint);
document.querySelector('#arise').onclick=()=>{active=true;started=performance.now();particles=[];bolts=[];msg.textContent='Le ombre si risvegliano…';setTimeout(()=>{if(active)msg.textContent='Pronto per lo scatto.'},3200)};
function drawVideoCover(o,w,h){const vw=v.videoWidth,vh=v.videoHeight;if(!vw||!vh)return false;const scale=Math.max(w/vw,h/vh),sw=vw*scale,sh=vh*scale; o.save();if(facing==='user'){o.translate(w,0);o.scale(-1,1)}o.drawImage(v,(w-sw)/2,(h-sh)/2,sw,sh);o.restore();return true}
document.querySelector('#shot').onclick=()=>{if(!v.videoWidth){msg.textContent='Attendi l’avvio della fotocamera.';return}const out=document.createElement('canvas');out.width=c.width;out.height=c.height;const o=out.getContext('2d');o.setTransform(out.width/innerWidth,0,0,out.height/innerHeight,0,0);drawVideoCover(o,innerWidth,innerHeight);o.drawImage(c,0,0,innerWidth,innerHeight);out.toBlob(blob=>{if(!blob)return;const old=save.dataset.url;if(old)URL.revokeObjectURL(old);const url=URL.createObjectURL(blob);save.dataset.url=url;save.href=url;save.style.display='block';save.click();msg.textContent='Foto pronta! Se non si salva automaticamente, tocca SALVA FOTO.'},'image/jpeg',.9)};
})();</script></body></html>
